# Used only when LITESTREAM_REPLICA_URL is set (see docker-entrypoint.sh).
# S3-compatible credentials come from LITESTREAM_ACCESS_KEY_ID and
# LITESTREAM_SECRET_ACCESS_KEY. For non-AWS storage, add
# ?endpoint=https://...&region=... to the replica URL.
dbs:
  - path: ${DATABASE_PATH}
    replica:
      url: ${LITESTREAM_REPLICA_URL}
